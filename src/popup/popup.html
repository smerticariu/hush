<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hush</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/32.png" alt="" width="22" height="22">
    <span class="brand">Hush</span>
    <a class="icon-btn" href="../dashboard/dashboard.html" target="_blank" title="Dashboard and settings" aria-label="Dashboard and settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 13h6V4H4zm0 7h6v-5H4zm8 0h8v-9h-8zm0-16v5h8V4z"/></svg>
    </a>
  </header>

  <main>
    <section class="hero" id="hero">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5z"/><path id="heroMark" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="m8.5 12 2.5 2.5 4.5-5"/></svg>
      </div>
      <p class="status" id="status">Checking this page…</p>
      <p class="host" id="host"></p>
    </section>

    <label class="toggle" id="toggleRow">
      <span class="toggle-text">
        <span class="toggle-title">Protection on this site</span>
        <span class="toggle-sub" id="toggleSub">Turn off if a site misbehaves</span>
      </span>
      <input type="checkbox" id="toggle" checked>
      <span class="track"><span class="thumb"></span></span>
    </label>

    <section class="page-stats" aria-label="Blocked on this page">
      <div class="stat ads"><span class="num" id="ads">0</span><span class="label">Ads</span></div>
      <div class="stat trackers"><span class="num" id="trackers">0</span><span class="label">Trackers</span></div>
      <div class="stat threats"><span class="num" id="threats">0</span><span class="label">Threats</span></div>
    </section>

    <p class="totals" id="totals"></p>

    <div class="actions">
      <button class="action" id="picker">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 3h6v2H5v4H3zm12 0h6v6h-2V5h-4zM3 15h2v4h4v2H3zm16 0h2v6h-6v-2h4zM9 9h6v6H9z"/></svg>
        Hide an element
      </button>
      <a class="action" href="../dashboard/dashboard.html" target="_blank">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M5 19h3v-7H5zm5.5 0h3V5h-3zM16 19h3v-10h-3z"/></svg>
        Your stats
      </a>
    </div>
  </main>

  <script src="popup.js" type="module"></script>
</body>
</html>
